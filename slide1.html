<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Competition-EMS</title>
  <!-- Pretendard (Korean) & Montserrat (English) Fonts -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    /* Reset & Base Settings */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      user-select: none;
    }

    /* 16:9 Presentation Scaler */
    .presentation-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000000;
    }

    .slide {
      position: absolute;
      width: 1920px;
      height: 1080px;
      background-color: #000000;
      color: #ffffff;
      overflow: hidden;
      transform-origin: center center;
      transition: background 2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Active Background style when started */
    .slide.started {
      background: radial-gradient(circle at 50% 50%, #06191c 0%, #01060e 100%);
    }

    /* Background Canvas */
    #bg-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      opacity: 0;
      transition: opacity 3s ease;
    }
    .slide.started #bg-canvas {
      opacity: 1;
    }

    /* Start Overlay Hint */
    .start-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      transition: opacity 1.5s cubic-bezier(0.22, 1, 0.36, 1), visibility 1.5s;
    }
    
    .slide.started .start-overlay {
      opacity: 0;
      visibility: hidden;
    }

    .start-hint {
      color: #ffffff;
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 0.2em;
      opacity: 0.7;
      animation: pulse 2s infinite ease-in-out;
      font-family: 'Montserrat', sans-serif;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.8; transform: scale(1.02); }
    }

    /* Content Layout */
    .slide-content-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 80px 100px;
    }

    /* Header styling */
    .slide-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      opacity: 0;
      transform: translateY(-20px);
      transition: opacity 1.5s cubic-bezier(0.22, 1, 0.36, 1), transform 1.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .slide.started .slide-header {
      opacity: 0.9;
      transform: translateY(0);
      transition-delay: 0.4s;
    }

    .event-tag {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .event-tag::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      background-color: #00ff66;
      border-radius: 50%;
      box-shadow: 0 0 10px #00ff66;
    }

    .univ-tag {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0.05em;
      color: #cbd5e1;
    }

    /* Main Content styling */
    .slide-main {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      margin-top: -40px; /* Optical center adjustment */
    }

    .title-container {
      margin-bottom: 24px;
      opacity: 0;
      transform: scale(0.95) translateY(30px);
      transition: opacity 2s cubic-bezier(0.22, 1, 0.36, 1), transform 2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .slide.started .title-container {
      opacity: 1;
      transform: scale(1) translateY(0);
      transition-delay: 1s;
    }

    .main-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 115px;
      letter-spacing: 0.04em;
      color: #ffffff;
      line-height: 1.1;
      text-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* Neon Green glow highlighting */
    .neon-green {
      color: #00ff66;
      text-shadow: 
        0 0 8px rgba(0, 255, 102, 0.8),
        0 0 20px rgba(0, 255, 102, 0.4),
        0 0 45px rgba(0, 255, 102, 0.2);
      animation: neonFlicker 4s infinite alternate;
    }

    @keyframes neonFlicker {
      0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
        text-shadow: 
          0 0 8px rgba(0, 255, 102, 0.8),
          0 0 20px rgba(0, 255, 102, 0.4),
          0 0 45px rgba(0, 255, 102, 0.2);
      }
      20%, 24%, 55% {
        text-shadow: none;
        color: rgba(0, 255, 102, 0.6);
      }
    }

    .subtitle-container {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1.8s cubic-bezier(0.22, 1, 0.36, 1), transform 1.8s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .slide.started .subtitle-container {
      opacity: 1;
      transform: translateY(0);
      transition-delay: 2.2s;
    }

    .sub-title {
      font-size: 34px;
      font-weight: 300;
      color: #e2e8f0;
      letter-spacing: 0.05em;
      line-height: 1.5;
    }
    
    .sub-title strong {
      font-weight: 700;
      color: #ffffff;
    }

    /* Footer styling */
    .slide-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1.5s cubic-bezier(0.22, 1, 0.36, 1), transform 1.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .slide.started .slide-footer {
      opacity: 0.85;
      transform: translateY(0);
      transition-delay: 3.2s;
    }

    .team-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .team-label {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #64748b;
    }

    .team-name {
      font-family: 'Montserrat', sans-serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #ffffff;
    }

    .members-info {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .members-label {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #64748b;
    }

    .member-names {
      font-size: 24px;
      font-weight: 400;
      letter-spacing: 0.08em;
      color: #e2e8f0;
    }
  </style>
</head>
<body>

  <div class="presentation-container">
    <div class="slide" id="slide1">
      
      <!-- Ambient Energy Network Canvas -->
      <canvas id="bg-canvas"></canvas>

      <!-- Start Overlay -->
      <div class="start-overlay" id="overlay">
        <div class="start-hint">Press [ SPACE ] to start</div>
      </div>

      <!-- Main Contents -->
      <div class="slide-content-wrapper">
        <!-- Top Header -->
        <header class="slide-header">
          <div class="event-tag">2026 HUSS AI 경진대회</div>
          <div class="univ-tag">영남대학교</div>
        </header>

        <!-- Center Titles -->
        <main class="slide-main">
          <div class="title-container">
            <h1 class="main-title">
              <span class="neon-green">C</span>ompetition-<span class="neon-green">EMS</span>
            </h1>
          </div>
          <div class="subtitle-container">
            <p class="sub-title">숨은 전력을 찾다 : <strong>참여형 경쟁 기반 에너지 관리 시스템</strong></p>
          </div>
        </main>

        <!-- Bottom Footer -->
        <footer class="slide-footer">
          <div class="team-info">
            <span class="team-label">Presented by</span>
            <span class="team-name">Team Aice</span>
          </div>
          <div class="members-info">
            <span class="members-label">Team Members</span>
            <span class="member-names">전승환 · 문효은 · 이승은 · 조명원</span>
          </div>
        </footer>
      </div>

    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // 1. 16:9 Aspect Ratio Auto-Scaler
    // -------------------------------------------------------------
    const slide = document.getElementById('slide1');
    const baseWidth = 1920;
    const baseHeight = 1080;

    function scaleSlide() {
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;

      // Calculate scale factors
      const scaleX = windowWidth / baseWidth;
      const scaleY = windowHeight / baseHeight;
      
      // Use the minimum scale factor to ensure the element fits within the viewport bounds
      const scale = Math.min(scaleX, scaleY);

      // Apply transformation (center-aligned scale)
      slide.style.transform = `scale(${scale})`;
    }

    // Initialize and bind resizing events
    window.addEventListener('resize', scaleSlide);
    window.addEventListener('DOMContentLoaded', scaleSlide);

    // -------------------------------------------------------------
    // 2. Spacebar Start Interaction
    // -------------------------------------------------------------
    let isStarted = false;

    window.addEventListener('keydown', (e) => {
      // Trigger if Spacebar is pressed and not yet started
      if ((e.code === 'Space' || e.key === ' ') && !isStarted) {
        e.preventDefault(); // Prevent default scroll behavior of Spacebar
        startPresentation();
      }
    });

    // Also support clicking anywhere to start for easier presenter control (e.g. presenter remote)
    const overlay = document.getElementById('overlay');
    overlay.addEventListener('click', () => {
      if (!isStarted) {
        startPresentation();
      }
    });

    function startPresentation() {
      isStarted = true;
      slide.classList.add('started');
      
      // Start Canvas Energy Wave animation
      initCanvasAnimation();
    }

    // -------------------------------------------------------------
    // 3. Canvas Background: Ambient Energy Flow
    // -------------------------------------------------------------
    function initCanvasAnimation() {
      const canvas = document.getElementById('bg-canvas');
      const ctx = canvas.getContext('2d');

      // Match canvas resolution to original slide coordinates
      canvas.width = baseWidth;
      canvas.height = baseHeight;

      // Energy wave lines configuration
      const waves = [
        {
          y: baseHeight * 0.65,
          length: 0.0012,
          amplitude: 45,
          frequency: 0.015,
          color: 'rgba(0, 255, 102, 0.08)',
          speed: 0.01
        },
        {
          y: baseHeight * 0.7,
          length: 0.0008,
          amplitude: 65,
          frequency: 0.01,
          color: 'rgba(0, 150, 255, 0.06)',
          speed: -0.007
        },
        {
          y: baseHeight * 0.58,
          length: 0.0015,
          amplitude: 30,
          frequency: 0.02,
          color: 'rgba(0, 255, 102, 0.04)',
          speed: 0.015
        }
      ];

      // Spark particles in background simulating electric grids
      const particles = [];
      for (let i = 0; i < 25; i++) {
        particles.push({
          x: Math.random() * baseWidth,
          y: Math.random() * baseHeight,
          size: Math.random() * 2 + 1,
          opacity: Math.random() * 0.5 + 0.1,
          speedY: -(Math.random() * 0.4 + 0.1),
          speedX: (Math.random() * 0.4 - 0.2),
          pulseSpeed: 0.01 + Math.random() * 0.02,
          pulseVal: Math.random() * Math.PI
        });
      }

      let time = 0;

      function animate() {
        if (!isStarted) return;
        requestAnimationFrame(animate);

        // Clear with slight trailing effect
        ctx.fillStyle = 'rgba(1, 6, 14, 0.2)';
        ctx.fillRect(0, 0, baseWidth, baseHeight);

        // Draw electrical grid background (soft vertical lines)
        ctx.strokeStyle = 'rgba(0, 255, 102, 0.015)';
        ctx.lineWidth = 1;
        const gridGap = 80;
        for (let x = 0; x < baseWidth; x += gridGap) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, baseHeight);
          ctx.stroke();
        }
        for (let y = 0; y < baseHeight; y += gridGap) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(baseWidth, y);
          ctx.stroke();
        }

        // Draw Waves (Energy flow)
        waves.forEach(wave => {
          ctx.beginPath();
          ctx.moveTo(0, wave.y);

          for (let i = 0; i < baseWidth; i++) {
            // Using sine/cosine equation to construct natural flow lines
            const yOffset = Math.sin(i * wave.length + time * wave.speed) * 
                            wave.amplitude * 
                            Math.sin(time * 0.002); // dynamic amplitude modulation
            ctx.lineTo(i, wave.y + yOffset);
          }

          ctx.strokeStyle = wave.color;
          ctx.lineWidth = 3;
          ctx.stroke();
        });

        // Update and draw Particles (Energy grid nodes)
        particles.forEach(p => {
          p.y += p.speedY;
          p.x += p.speedX;
          p.pulseVal += p.pulseSpeed;
          
          // Re-wrap particles if they go off-screen
          if (p.y < -10) p.y = baseHeight + 10;
          if (p.x < -10 || p.x > baseWidth + 10) p.x = Math.random() * baseWidth;

          // Pulse opacity for twinkle effect
          const currentOpacity = p.opacity * (0.5 + 0.5 * Math.sin(p.pulseVal));

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(0, 255, 102, ${currentOpacity})`;
          ctx.fill();

          // Connect nearby particles with subtle lines
          particles.forEach(p2 => {
            const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
            if (dist < 180) {
              const alpha = (1 - dist / 180) * 0.05 * currentOpacity;
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.strokeStyle = `rgba(0, 255, 102, ${alpha})`;
              ctx.stroke();
            }
          });
        });

        time += 1;
      }

      animate();
    }
  </script>
</body>
</html>
