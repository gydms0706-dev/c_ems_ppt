<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Competition-EMS | 가상 공간 표지</title>

  <!-- 세련된 폰트 CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;700;900&display=swap" rel="stylesheet">

  <!-- GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      background: #000206;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: 'Rajdhani', 'Noto Sans KR', sans-serif;
      color: #fff;
    }

    #slide {
      width: 100%;
      height: 100vh;
      position: relative;
      overflow: hidden;
      background: #000206;
    }

    /* ══════════════════════════════
       배경 레이어 : 깊은 우주 암흑
    ══════════════════════════════ */
    .bg-cosmos {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 50% 50% at 50% 50%, #010a18 0%, transparent 80%),
        linear-gradient(180deg, #000103 0%, #000309 50%, #000103 100%);
      z-index: 1;
    }

    /* ══════════════════════════════
       3D 스파링장 (Ring) 입체 격자망 공간
    ══════════════════════════════ */
    .ring-space {
      position: absolute;
      inset: 0;
      z-index: 2;
      perspective: 350px; /* 깊은 공간 왜곡 */
      perspective-origin: 50% 45%;
      overflow: hidden;
    }

    /* 링 바닥 그리드 */
    .ring-floor {
      position: absolute;
      bottom: -20%;
      left: -50%;
      width: 200%;
      height: 120%;
      transform: rotateX(80deg);
      transform-origin: bottom center;
      background-image:
        linear-gradient(to right, rgba(0, 232, 255, 0.12) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 232, 255, 0.12) 1px, transparent 1px);
      background-size: 80px 80px;
      -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.4) 60%, rgba(0,0,0,0) 100%);
      mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.4) 60%, rgba(0,0,0,0) 100%);
    }

    /* 스파링 링 좌측 로프(경계선) */
    .ring-rope-left {
      position: absolute;
      left: -10%;
      top: 0;
      width: 60%;
      height: 100%;
      transform: rotateY(70deg) translate3d(0, 0, 0);
      transform-origin: left center;
      border-right: 2px solid rgba(0, 255, 180, 0.3);
      box-shadow: 2px 0 10px rgba(0, 255, 180, 0.15);
      background: linear-gradient(to right, transparent, rgba(0, 255, 180, 0.01) 90%, rgba(0, 255, 180, 0.05) 100%);
      /* 세 줄 로프 느낌 */
      background-image: 
        repeating-linear-gradient(to bottom, transparent, transparent 120px, rgba(0, 255, 180, 0.2) 120px, rgba(0, 255, 180, 0.2) 123px);
      opacity: 0.6;
    }

    /* 스파링 링 우측 로프(경계선) */
    .ring-rope-right {
      position: absolute;
      right: -10%;
      top: 0;
      width: 60%;
      height: 100%;
      transform: rotateY(-70deg) translate3d(0, 0, 0);
      transform-origin: right center;
      border-left: 2px solid rgba(255, 0, 128, 0.3);
      box-shadow: -2px 0 10px rgba(255, 0, 128, 0.15);
      background: linear-gradient(to left, transparent, rgba(255, 0, 128, 0.01) 90%, rgba(255, 0, 128, 0.05) 100%);
      background-image: 
        repeating-linear-gradient(to bottom, transparent, transparent 120px, rgba(255, 0, 128, 0.2) 120px, rgba(255, 0, 128, 0.2) 123px);
      opacity: 0.6;
    }

    /* 지평선 경계 */
    .ring-horizon {
      position: absolute;
      top: 45%;
      left: 0;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0, 232, 255, 0.3), transparent);
      z-index: 3;
    }

    /* ══════════════════════════════
       중앙 충돌 전력 그래프
    ══════════════════════════════ */
    .graph-container {
      position: absolute;
      top: 45%;
      left: 0;
      width: 100%;
      height: 300px;
      transform: translateY(-50%);
      z-index: 4;
      pointer-events: none;
    }

    .power-svg {
      width: 100%;
      height: 100%;
    }

    .power-line {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* 좌측 파랑 팀 그래프 */
    .line-left {
      stroke: #00e8ff;
      stroke-width: 3.5;
      filter: drop-shadow(0 0 8px #00e8ff) drop-shadow(0 0 15px rgba(0, 232, 255, 0.4));
    }

    /* 우측 핑크 팀 그래프 */
    .line-right {
      stroke: #ff0080;
      stroke-width: 3.5;
      filter: drop-shadow(0 0 8px #ff0080) drop-shadow(0 0 15px rgba(255, 0, 128, 0.4));
    }

    /* 충돌 파동 스파크 링 */
    .collision-flash {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(0);
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 10%, #00e8ff 40%, #ff0080 70%, transparent 100%);
      filter: blur(4px);
      opacity: 0;
      z-index: 5;
      pointer-events: none;
    }

    /* 충돌 불꽃 스파크 조각들 */
    .spark {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 6px;
      height: 6px;
      background: #fff;
      border-radius: 50%;
      z-index: 6;
      opacity: 0;
      pointer-events: none;
    }
    .spark.blue { background: #00e8ff; box-shadow: 0 0 8px #00e8ff; }
    .spark.pink { background: #ff0080; box-shadow: 0 0 8px #ff0080; }

    /* ══════════════════════════════
       메인 콘텐츠 레이어
    ══════════════════════════════ */
    .content {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 50px 60px 60px;
      pointer-events: none;
    }

    /* 상단 미니멀 정보 배치 */
    .hud-top-minimal {
      display: flex;
      justify-content: space-between;
      width: 100%;
      opacity: 0;
      transform: translateY(-10px);
    }

    .top-left-label {
      font-size: 1.15rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: 0.05em;
      border-left: 3px solid #00e8ff;
      padding-left: 10px;
    }

    .top-right-label {
      font-size: 1.15rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: 0.05em;
      border-right: 3px solid #ff0080;
      padding-right: 10px;
    }

    /* 메인 타이틀 영역 */
    .main-hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* 타이틀 한 줄 배치 및 선명화 */
    .title-main {
      font-family: 'Orbitron', monospace;
      font-size: 7.5vw;
      font-weight: 900;
      letter-spacing: 0.02em;
      line-height: 1;
      white-space: nowrap;
      margin-bottom: 24px;
      color: #fff;
      text-shadow:
        0 0 10px rgba(0, 232, 255, 0.8),
        0 0 25px rgba(255, 0, 128, 0.5),
        0 0 60px rgba(0, 232, 255, 0.2);
      opacity: 0;
      transform: scale(0.3) translateZ(-150px);
      filter: blur(15px);
    }

    /* 두 보색 대비 타이틀 액센트 */
    .title-accent-left {
      color: #00e8ff;
      text-shadow: 0 0 12px #00e8ff, 0 0 30px rgba(0, 232, 255, 0.4);
    }
    .title-accent-right {
      color: #ff0080;
      text-shadow: 0 0 12px #ff0080, 0 0 30px rgba(255, 0, 128, 0.4);
    }

    /* 부제 */
    .title-sub {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 2.3rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: rgba(220, 240, 255, 0.95);
      text-shadow: 0 0 15px rgba(0, 232, 255, 0.3);
      opacity: 0;
      transform: translateY(15px);
    }

    .divider {
      width: 200px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #00e8ff, #ff0080, transparent);
      margin: 24px auto 0;
      opacity: 0;
      box-shadow: 0 0 6px #00e8ff;
    }

    /* 하단 미니멀 정보 배치 */
    .hud-bottom-minimal {
      width: 100%;
      text-align: center;
      opacity: 0;
      transform: translateY(10px);
    }

    .bottom-label {
      font-family: 'Noto Sans KR', 'Rajdhani', sans-serif;
      font-size: 1.35rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: #e2f4ff;
      display: inline-block;
      padding: 10px 30px;
      border: 1px solid rgba(0, 232, 255, 0.15);
      background: rgba(0, 2, 6, 0.6);
      border-radius: 4px;
    }

    .bottom-label .neon-team {
      color: #00e8ff;
      font-weight: 700;
      text-shadow: 0 0 8px #00e8ff;
      margin-right: 12px;
    }

    /* ── 네온 Pulse 호흡 애니메이션 ── */
    @keyframes neonPulse {
      0%, 100% {
        text-shadow:
          0 0 10px rgba(0, 232, 255, 0.8),
          0 0 25px rgba(255, 0, 128, 0.5),
          0 0 60px rgba(0, 232, 255, 0.2);
      }
      50% {
        text-shadow:
          0 0 6px rgba(0, 232, 255, 0.5),
          0 0 15px rgba(255, 0, 128, 0.3),
          0 0 40px rgba(0, 232, 255, 0.15);
      }
    }

    .title-main.glowing {
      animation: neonPulse 3s ease-in-out infinite;
    }
  </style>
</head>
<body>

<div id="slide">

  <!-- ── 딥 블랙 네이비 배경 ── -->
  <div class="bg-cosmos"></div>

  <!-- 3D 스파링장 가상 격자 링 공간 -->
  <div class="ring-space">
    <div class="ring-floor"></div>
    <div class="ring-rope-left"></div>
    <div class="ring-rope-right"></div>
    <div class="ring-horizon"></div>
  </div>

  <!-- 양방향 충돌 그래프 콘테이너 -->
  <div class="graph-container">
    <!-- 충돌 섬광 오버레이 -->
    <div class="collision-flash" id="flash"></div>

    <!-- 스파크 입자들 -->
    <div class="spark blue" id="sp-b1"></div>
    <div class="spark blue" id="sp-b2"></div>
    <div class="spark blue" id="sp-b3"></div>
    <div class="spark pink" id="sp-p1"></div>
    <div class="spark pink" id="sp-p2"></div>
    <div class="spark pink" id="sp-p3"></div>

    <svg class="power-svg" viewBox="0 0 1920 300" preserveAspectRatio="none">
      <!-- 좌측에서 출발하는 파란색 그래프 (0 -> 960) -->
      <path class="power-line line-left" id="path-left"
        d="M 0,150 
           L 200,150 
           Q 240,150 260,90 
           T 280,210 
           T 300,150 
           L 500,150 
           Q 530,150 550,50 
           T 570,250 
           T 590,150 
           L 750,150 
           Q 780,150 800,80 
           T 820,220 
           T 840,150 
           L 960,150" />

      <!-- 우측에서 출발하는 핑크색 그래프 (1920 -> 960) -->
      <path class="power-line line-right" id="path-right"
        d="M 1920,150 
           L 1720,150 
           Q 1680,150 1660,90 
           T 1640,210 
           T 1620,150 
           L 1420,150 
           Q 1390,150 1370,50 
           T 1350,250 
           T 1330,150 
           L 1170,150 
           Q 1140,150 1120,80 
           T 1100,220 
           T 1080,150 
           L 960,150" />
    </svg>
  </div>

  <!-- ── 텍스트 콘텐츠 레이어 ── -->
  <div class="content">

    <!-- 상단 좌우 배치 -->
    <div class="hud-top-minimal" id="hud-top">
      <div class="top-left-label">2026 HUSS AI 경진대회</div>
      <div class="top-right-label">영남대학교</div>
    </div>

    <!-- 중앙 타이틀 -->
    <div class="main-hero">
      <h1 class="title-main" id="title-main">
        <span class="title-accent-left">C</span>ompetition<span style="color:rgba(255,255,255,0.35)">-</span><span class="title-accent-right">EMS</span>
      </h1>
      <h2 class="title-sub" id="title-sub">참여형 경쟁 기반 에너지 관리 시스템</h2>
      <div class="divider" id="divider"></div>
    </div>

    <!-- 하단 중앙 배치 -->
    <div class="hud-bottom-minimal" id="hud-bottom">
      <div class="bottom-label">
        <span class="neon-team">Aice</span> 전승환 · 문효은 · 이승은 · 조명원
      </div>
    </div>

  </div>
</div>

<script>
  // ═══════════════════════════════════════════════════════════
  // GSAP 경쟁 연출 시퀀스 (그래프 충돌 ➔ 충격파 ➔ 타이틀 등장)
  // ═══════════════════════════════════════════════════════════
  const tl = gsap.timeline();

  // 초기 상태 셋업
  gsap.set('.power-line', { strokeDasharray: 2000, strokeDashoffset: 2000 });
  gsap.set('#title-main', { opacity: 0, scale: 0.3 });
  gsap.set('#title-sub', { opacity: 0, y: 15 });
  gsap.set('#divider', { opacity: 0 });
  gsap.set(['#hud-top', '#hud-bottom'], { opacity: 0 });

  // ── 1단계: 좌/우 전력 파형 그래프가 양쪽에서 중앙으로 그려짐 (0s ~ 1.5s) ──
  tl.to('#path-left', {
    strokeDashoffset: 0,
    duration: 1.5,
    ease: 'power2.out'
  }, 0.0);

  tl.to('#path-right', {
    strokeDashoffset: 0,
    duration: 1.5,
    ease: 'power2.out'
  }, 0.0);

  // ── 2단계: 중앙 격돌 순간 (1.5s) 스파크 및 충격파 섬광 폭발 ──
  tl.add(() => {
    // 중앙 플래시 커짐
    gsap.to('#flash', {
      scale: 3.5,
      opacity: 0.9,
      duration: 0.15,
      ease: 'power1.out',
      onComplete: () => {
        gsap.to('#flash', { scale: 6, opacity: 0, duration: 0.35, ease: 'power2.out' });
      }
    });

    // 뿜어져 나가는 스파크 파티클 연출
    const sparks = [
      { id: '#sp-b1', x: -120, y: -70 },
      { id: '#sp-b2', x: -90, y: 90 },
      { id: '#sp-b3', x: -160, y: 20 },
      { id: '#sp-p1', x: 120, y: -80 },
      { id: '#sp-p2', x: 90, y: 80 },
      { id: '#sp-p3', x: 170, y: -10 }
    ];

    sparks.forEach(sp => {
      gsap.set(sp.id, { x: 0, y: 0, opacity: 1, scale: 1 });
      gsap.to(sp.id, {
        x: sp.x,
        y: sp.y,
        scale: 0.2,
        opacity: 0,
        duration: 0.6,
        ease: 'power2.out'
      });
    });
  }, 1.45); // 충돌 0.05초 전 싱크 맞춤

  // ── 3단계: 충돌 직후 타이틀 등장 (1.5s ~ 2.7s) ──
  tl.to('#title-main', {
    opacity: 1,
    scale: 1,
    filter: 'blur(0px)',
    duration: 0.9,
    ease: 'back.out(1.2)'
  }, 1.6);

  // 글씨 네온 Flicker 부팅
  tl.add(() => {
    const el = document.getElementById('title-main');
    gsap.to(el, {
      opacity: 0.2,
      duration: 0.05,
      yoyo: true,
      repeat: 5,
      ease: 'none',
      onComplete: () => {
        el.classList.add('glowing');
        gsap.set(el, { opacity: 1 });
      }
    });
  }, 2.4);

  // 부제 및 구분선 등장
  tl.to('#title-sub', {
    opacity: 1,
    y: 0,
    duration: 0.7,
    ease: 'power2.out'
  }, 2.1);

  tl.to('#divider', {
    opacity: 1,
    duration: 0.4,
    ease: 'power2.out'
  }, 2.4);

  // 상단 텍스트 및 하단 발표자 텍스트 순차 페이드인
  tl.to('#hud-top', {
    opacity: 1,
    y: 0,
    duration: 0.6,
    ease: 'power2.out'
  }, 2.6);

  tl.to('#hud-bottom', {
    opacity: 1,
    y: 0,
    duration: 0.6,
    ease: 'power2.out'
  }, 2.8);
</script>

</body>
</html>
